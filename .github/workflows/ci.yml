# Quality gates. Not yet exercised: the repository has no GitHub remote until the owner
# publishes (see ROADMAP.md). Tests never touch the network or spend money, so no secrets are
# configured here. The full-history gitleaks scan is a manual pre-publish step.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
