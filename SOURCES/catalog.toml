# Owner-approved Phase 0 source catalog (approved 2026-10-15).
#
# This file lists WHAT to fetch. It is not evidence: a source counts as verified only when the
# fetcher downloads it and writes a manifest.jsonl row. `expected_phrases` must all appear in the
# fetched document's opening text (first 3 PDF pages, or first 6,000 characters of XML/HTML),
# otherwise the row is marked MISMATCH. Titles below were observed by a research pass and are
# re-checked against the fetched text; the manifest, not this file, is authoritative.
#
# terms_status: OBSERVED = a fetched terms page contains `terms_quote`; UNVERIFIED = no readable
# terms statement was found, so the item is treated as a US government work for local use only.

