# Local container run: `CLAIMS_COPILOT_API_KEY=... docker compose -f deploy/compose.yaml up --build`
# (set the key in your shell, not in this file). Published on loopback only.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: claims-copilot-api:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLAIMS_COPILOT_API_KEY: ${CLAIMS_COPILOT_API_KEY:?set CLAIMS_COPILOT_API_KEY in your shell}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - audit:/app/data/audit
      - traces:/app/data/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

volumes:
  audit: {}
  traces: {}
