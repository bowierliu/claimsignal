[project]
name = "claims-copilot"
version = "0.0.1"
description = "Claims investigation and payment integrity copilot (synthetic data, public sources only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
# Seeded `random` is the point of the synthetic generator (reproducible data, no security use).
"src/claims_copilot/synth/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", ".cursor/hooks"]
mypy_path = "src:tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Starlette's TestClient prefers `httpx2`, which is not a verified dependency here (see
    # DECISIONS.md). Plain httpx still works; only this warning is silenced.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
